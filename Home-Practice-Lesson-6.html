<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#BDE9FF">
<title>Sight Word Stars · Home Practice - Lesson 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1D3557; --coral:#FF6B6B; --coral-d:#D9485B;
    --yellow:#FFD93D; --yellow-d:#E0A800;
    --green:#37B24D;  --green-d:#2B8A3E;
    --soft:#5C7A9E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Nunito',sans-serif;color:var(--ink);
    background:linear-gradient(#BDE9FF 0%,#EAF9FF 62%,#DFF7E4 100%);
    overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none;
  }

  /* ---------- SCENE (sky, sun, clouds, hills) ---------- */
  .scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .sun{position:absolute;top:4%;right:5%;width:clamp(72px,13vw,120px);animation:spin 48s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .cloud{position:absolute;background:#fff;border-radius:40px;opacity:.92;animation:drift linear infinite}
  .cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
  .cloud::before{width:calc(38px*var(--s,1));height:calc(38px*var(--s,1));top:calc(-20px*var(--s,1));left:calc(14px*var(--s,1))}
  .cloud::after{width:calc(26px*var(--s,1));height:calc(26px*var(--s,1));top:calc(-13px*var(--s,1));right:calc(14px*var(--s,1))}
  .cloud{width:calc(86px*var(--s,1));height:calc(28px*var(--s,1))}
  @keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(118vw)}}
  .hill{position:absolute;border-radius:50%}
  .hill-a{width:170vw;height:80vh;left:-35vw;bottom:-52vh;background:#9BE27A}
  .hill-b{width:180vw;height:85vh;right:-45vw;bottom:-60vh;background:#79D15F}
  .flower{position:absolute;font-size:clamp(20px,3.4vw,30px);transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}

  /* ---------- LAYOUT ---------- */
  .app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center}
  .topbar{width:min(680px,94vw);display:flex;justify-content:space-between;align-items:center;padding:14px 6px 8px;flex-wrap:wrap;row-gap:8px}
  .brand{font-family:'Baloo 2';font-weight:800;font-size:clamp(1.15rem,4vw,1.5rem);display:flex;gap:8px;align-items:center}
  .brand .bstar{color:#FFB703;display:inline-block;animation:twinkle 2.4s ease-in-out infinite}
  @keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.25) rotate(18deg)}}
  .top-right{display:flex;align-items:center;gap:8px}
  .week-chip{background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:.78rem;white-space:nowrap;box-shadow:0 3px 0 rgba(29,53,87,.12)}
  .btn-reset{width:34px;height:34px;border-radius:50%;border:none;background:#fff;box-shadow:0 3px 0 rgba(29,53,87,.12);
    font-size:1.05rem;cursor:pointer;color:var(--soft);transition:transform .3s}
  .btn-reset:hover{transform:rotate(-180deg)}

  /* progress chips */
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;width:min(680px,94vw)}
  .chip{font-family:'Baloo 2';font-weight:700;font-size:.85rem;background:rgba(255,255,255,.78);color:#93A8C4;
    border-radius:999px;padding:3px 11px;box-shadow:0 2px 0 rgba(29,53,87,.1);transition:background .3s,color .3s}
  .chip::before{content:'☆';margin-right:5px;color:#C3D2E4}
  .chip.done{background:#FFF3BF;color:#7A5900;box-shadow:0 2px 0 #F0C33C}
  .chip.done::before{content:'★';color:#FFB703}
  .chip.pop{animation:chipPop .55s cubic-bezier(.34,1.56,.64,1)}
  @keyframes chipPop{0%{transform:scale(1)}50%{transform:scale(1.35) rotate(-6deg)}100%{transform:scale(1)}}

  /* ---------- WORD AREA ---------- */
  .word-area{display:flex;align-items:center;gap:clamp(10px,3vw,26px);margin:auto 0;width:min(680px,94vw)}
  .owl{width:clamp(92px,26vw,150px);flex:none;position:relative}
  .bob{animation:bob 3.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .owl svg{width:100%;display:block;transition:transform .35s}
  .owl.mood-listen svg{transform:rotate(-5deg)}
  .eyes-happy{display:none}
  .owl.mood-happy .eyes-open{display:none}
  .owl.mood-happy .eyes-happy{display:block}
  .eyes-open{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
  @keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.15)}}
  .wing-l,.wing-r{transition:transform .35s cubic-bezier(.34,1.56,.64,1);transform-box:fill-box}
  .wing-l{transform-origin:85% 12%}
  .wing-r{transform-origin:15% 12%}
  .owl.mood-happy .wing-l{transform:rotate(-30deg)}
  .owl.mood-happy .wing-r{transform:rotate(30deg)}

  .bubble{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%) rotate(-2deg);
    background:#fff;border-radius:16px;padding:8px 14px;font-family:'Baloo 2';font-weight:700;
    font-size:.9rem;line-height:1.25;text-align:center;width:max-content;max-width:230px;
    box-shadow:0 4px 0 rgba(29,53,87,.12);transition:opacity .4s,transform .4s;z-index:3}
  .bubble::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
    border:8px solid transparent;border-top-color:#fff}
  .bubble.hide{opacity:0;transform:translateX(-50%) translateY(10px)}

  .word-card{position:relative;background:#fff;border-radius:26px;flex:1;
    padding:clamp(18px,4vw,30px) clamp(20px,6vw,50px);transform:rotate(-1.6deg);
    box-shadow:0 9px 0 rgba(29,53,87,.14),0 20px 34px rgba(29,53,87,.14)}
  .tape{position:absolute;top:-12px;width:70px;height:24px;background:rgba(255,213,61,.85);border-radius:4px;box-shadow:0 2px 4px rgba(0,0,0,.08)}
  .tape.l{left:12%;transform:rotate(-8deg)}
  .tape.r{right:12%;transform:rotate(7deg)}
  .say-label{display:block;text-align:center;font-weight:800;font-size:.9rem;letter-spacing:.4px;color:var(--soft);margin-bottom:2px}
  .word{font-family:'Baloo 2';font-weight:800;font-size:clamp(4.2rem,19vw,8.5rem);line-height:1;color:var(--ink);text-align:center}
  .word-card.pop{animation:cardPop .55s cubic-bezier(.34,1.56,.64,1)}
  @keyframes cardPop{0%{transform:rotate(-1.6deg) scale(.5)}70%{transform:rotate(-1.6deg) scale(1.08)}100%{transform:rotate(-1.6deg) scale(1)}}
  .word-card.tap-to-hear{cursor:pointer}

  /* ---------- FEEDBACK ---------- */
  .feedback{min-height:58px;margin-top:clamp(10px,2.5vh,20px);font-family:'Baloo 2';font-weight:800;
    font-size:clamp(1.35rem,5.4vw,2rem);opacity:0;transform:scale(.7);text-align:center;padding:0 12px}
  .feedback.show{animation:fbPop .45s cubic-bezier(.34,1.56,.64,1) forwards}
  .feedback.good{color:#2F9E44}.feedback.try{color:#E8590C}.feedback.hint{color:#1971C2}
  .feedback.listen{color:#1971C2;font-size:clamp(1.05rem,4.3vw,1.45rem)}
  @keyframes fbPop{to{opacity:1;transform:scale(1)}}

  /* animated "I'm listening" bars */
  .bars{display:inline-flex;gap:4px;align-items:flex-end;height:26px;margin-right:10px;vertical-align:middle}
  .bars i{width:6px;border-radius:3px;background:#4DABF7;animation:wv .9s ease-in-out infinite}
  .bars i:nth-child(1){height:10px;animation-delay:-.2s}
  .bars i:nth-child(2){height:18px;animation-delay:-.45s}
  .bars i:nth-child(3){height:26px;animation-delay:-.1s}
  .bars i:nth-child(4){height:16px;animation-delay:-.55s}
  .bars i:nth-child(5){height:12px;animation-delay:-.3s}
  @keyframes wv{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

  .heard{display:block;font-family:'Nunito';font-weight:700;font-size:.95rem;color:#8AA0B8;margin-top:3px}

  /* ---------- CONTROLS ---------- */
  .controls{display:flex;align-items:center;gap:clamp(24px,7vw,50px);padding:16px 0 14px}
  .ctrl{display:flex;flex-direction:column;align-items:center;gap:10px}
  .ctrl-label{font-weight:800;font-size:.95rem;color:#3E5C76}
  .btn{border:none;cursor:pointer;border-radius:50%;display:grid;place-items:center;color:#fff;
    transition:transform .12s,box-shadow .12s,filter .2s;touch-action:manipulation}
  .btn:active:not(:disabled){transform:translateY(6px)}
  .btn:disabled{cursor:default;filter:saturate(.5) brightness(1.03)}
  .btn-mic{width:clamp(104px,30vw,132px);height:clamp(104px,30vw,132px);background:var(--coral);position:relative;
    box-shadow:0 8px 0 var(--coral-d),0 16px 24px rgba(217,72,91,.35)}
  .btn-mic:active:not(:disabled){box-shadow:0 2px 0 var(--coral-d)}
  .btn-mic svg{width:46%;height:46%}
  .btn-mic.listening::after{content:'';position:absolute;inset:-4px;border-radius:50%;
    border:5px solid rgba(255,107,107,.85);animation:ring 1.1s ease-out infinite}
  @keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.45);opacity:0}}
  .btn-help{width:clamp(78px,22vw,96px);height:clamp(78px,22vw,96px);background:var(--yellow);color:var(--ink);
    font-family:'Baloo 2';font-weight:800;font-size:clamp(2.4rem,9vw,3.2rem);line-height:1;padding-bottom:.18em;
    box-shadow:0 7px 0 var(--yellow-d),0 14px 20px rgba(224,168,0,.3)}
  .btn-help:active:not(:disabled){box-shadow:0 2px 0 var(--yellow-d)}

  /* ---------- PARENT CONTROLS (subtle, for grown-ups) ---------- */
  .parent-bar{display:flex;align-items:center;gap:10px;padding-bottom:clamp(14px,3vh,26px)}
  .parent-tag{font-weight:800;font-size:.68rem;letter-spacing:1.2px;text-transform:uppercase;color:#9FB3C8}
  .btn-parent{background:#fff;border:2px solid #CBD9E8;color:#5C7A9E;font-family:'Nunito',sans-serif;
    font-weight:800;font-size:.9rem;border-radius:999px;padding:9px 18px;cursor:pointer;
    box-shadow:0 3px 0 rgba(29,53,87,.1);transition:transform .1s,box-shadow .1s,border-color .2s,color .2s;
    touch-action:manipulation}
  .btn-parent:hover{border-color:#8FA9C4;color:#3E5C76}
  .btn-parent:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(29,53,87,.1)}

  .note{margin-top:4px;background:#FFF9DB;border:2px dashed #F5C842;color:#7A5900;font-weight:700;
    font-size:.85rem;padding:8px 14px;border-radius:12px;max-width:min(680px,90vw);text-align:center;display:none}
  .note.show{display:block}

  /* ---------- CELEBRATION ---------- */
  .overlay{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(214,240,255,.9);padding:20px}
  .overlay.show{display:grid}
  .celebrate{background:#fff;border-radius:34px;padding:clamp(28px,6vw,48px) clamp(24px,7vw,56px);text-align:center;
    max-width:520px;width:100%;box-shadow:0 14px 0 rgba(29,53,87,.12),0 30px 60px rgba(29,53,87,.2);
    animation:cardPop .6s cubic-bezier(.34,1.56,.64,1)}
  .celebrate .big-owl{width:clamp(120px,34vw,160px);margin:0 auto 4px}
  .celebrate h2{font-family:'Baloo 2';font-weight:800;font-size:clamp(1.9rem,7vw,2.6rem)}
  .celebrate p{font-weight:700;color:var(--soft);margin:8px 0 24px;font-size:1.05rem}
  .btn-again{background:var(--green);color:#fff;font-family:'Baloo 2';font-weight:800;font-size:1.25rem;
    border:none;border-radius:999px;padding:14px 40px;box-shadow:0 7px 0 var(--green-d);cursor:pointer;transition:transform .12s,box-shadow .12s}
  .btn-again:active{transform:translateY(5px);box-shadow:0 2px 0 var(--green-d)}

  #confetti{position:fixed;inset:0;z-index:70;pointer-events:none}
</style>
</head>
<body>

<!-- background scene -->
<div class="scene" aria-hidden="true">
  <svg class="sun" viewBox="0 0 120 120">
    <g fill="#FFD166">
      <circle cx="60" cy="60" r="28"/>
      <g>
        <rect x="57" y="4"  width="6" height="20" rx="3"/>
        <rect x="57" y="96" width="6" height="20" rx="3"/>
        <rect x="4"  y="57" width="20" height="6" rx="3"/>
        <rect x="96" y="57" width="20" height="6" rx="3"/>
        <rect x="57" y="4"  width="6" height="20" rx="3" transform="rotate(45 60 60)"/>
        <rect x="57" y="96" width="6" height="20" rx="3" transform="rotate(45 60 60)"/>
        <rect x="4"  y="57" width="20" height="6" rx="3" transform="rotate(45 60 60)"/>
        <rect x="96" y="57" width="20" height="6" rx="3" transform="rotate(45 60 60)"/>
      </g>
    </g>
  </svg>
  <div class="cloud" style="--s:1;   top:12%; animation-duration:55s;  animation-delay:-8s"></div>
  <div class="cloud" style="--s:.7;  top:26%; animation-duration:75s;  animation-delay:-40s"></div>
  <div class="cloud" style="--s:1.25;top:7%;  animation-duration:90s;  animation-delay:-65s"></div>
  <div class="cloud" style="--s:.85; top:38%; animation-duration:65s;  animation-delay:-25s"></div>
  <div class="hill hill-a"></div>
  <div class="hill hill-b"></div>
  <span class="flower" style="left:8%;  bottom:9%;  animation-delay:-.5s">🌼</span>
  <span class="flower" style="left:20%; bottom:5%;  animation-delay:-1.6s">🌷</span>
  <span class="flower" style="right:12%;bottom:8%;  animation-delay:-.9s">🌻</span>
  <span class="flower" style="right:26%;bottom:4%;  animation-delay:-2.2s">🌼</span>
</div>

<div class="app">
  <header class="topbar">
    <div class="brand"><span class="bstar">★</span> Sight Word Stars</div>
    <div class="top-right">
      <span class="week-chip">Home Practice - Lesson 6 · 12 words</span>
      <button class="btn-reset" id="resetBtn" title="Start over" aria-label="Start over">↺</button>
    </div>
  </header>

  <section class="chips" id="chips" aria-label="Words mastered this week"></section>

  <main class="word-area">
    <div class="owl" id="owl">
      <div class="bubble" id="bubble">Hi! Tap the 🎤 and say the word!</div>
      <div class="bob">
        <svg viewBox="0 0 220 215" aria-hidden="true">
          <ellipse class="wing-l" cx="40"  cy="130" rx="20" ry="44" fill="#E8935A"/>
          <ellipse class="wing-r" cx="180" cy="130" rx="20" ry="44" fill="#E8935A"/>
          <path d="M60 58 L44 20 L92 42 Z" fill="#E8935A"/>
          <path d="M160 58 L176 20 L128 42 Z" fill="#E8935A"/>
          <ellipse cx="110" cy="122" rx="76" ry="80" fill="#F4A261"/>
          <ellipse cx="110" cy="156" rx="46" ry="38" fill="#FFF3E0"/>
          <circle cx="84"  cy="96" r="29" fill="#FFFDF7"/>
          <circle cx="136" cy="96" r="29" fill="#FFFDF7"/>
          <g class="eyes-open">
            <circle cx="84"  cy="98" r="12" fill="#3B2F2A"/>
            <circle cx="136" cy="98" r="12" fill="#3B2F2A"/>
            <circle cx="88"  cy="93" r="4.5" fill="#fff"/>
            <circle cx="140" cy="93" r="4.5" fill="#fff"/>
          </g>
          <g class="eyes-happy" stroke="#3B2F2A" stroke-width="6" fill="none" stroke-linecap="round">
            <path d="M70 98 Q84 82 98 98"/>
            <path d="M122 98 Q136 82 150 98"/>
          </g>
          <path d="M110 112 L97 124 Q110 136 123 124 Z" fill="#FFB703"/>
          <ellipse cx="86"  cy="204" rx="13" ry="6" fill="#FFB703"/>
          <ellipse cx="134" cy="204" rx="13" ry="6" fill="#FFB703"/>
        </svg>
      </div>
    </div>

    <div class="word-card" id="card">
      <span class="tape l"></span><span class="tape r"></span>
      <span class="say-label">👉 Say this word</span>
      <div class="word" id="word">Bam</div>
    </div>
  </main>

  <div class="feedback" id="feedback" aria-live="polite"></div>

  <div class="controls">
    <div class="ctrl">
      <button class="btn btn-help" id="helpBtn" aria-label="Hear the word">?</button>
      <span class="ctrl-label">Hear it</span>
    </div>
    <div class="ctrl">
      <button class="btn btn-mic" id="micBtn" aria-label="Say the word">
        <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>
      <span class="ctrl-label" id="micLabel">Say the word</span>
    </div>
  </div>

  <div class="parent-bar">
    <span class="parent-tag">Parent</span>
    <button class="btn-parent" id="parentBtn" aria-label="Parent: mark word correct and go to next">✓ Mark correct · next word</button>
  </div>

  <p class="note" id="noSrNote">This browser can’t listen yet — try Chrome. Tap the word to hear it, and tap ? anytime.</p>
</div>

<!-- celebration -->
<div class="overlay" id="overlay">
  <div class="celebrate">
    <div class="big-owl owl mood-happy" aria-hidden="true">
      <svg viewBox="0 0 220 215" style="width:100%;display:block">
        <ellipse cx="40"  cy="130" rx="20" ry="44" fill="#E8935A" transform="rotate(-30 52 96)"/>
        <ellipse cx="180" cy="130" rx="20" ry="44" fill="#E8935A" transform="rotate(30 168 96)"/>
        <path d="M60 58 L44 20 L92 42 Z" fill="#E8935A"/>
        <path d="M160 58 L176 20 L128 42 Z" fill="#E8935A"/>
        <ellipse cx="110" cy="122" rx="76" ry="80" fill="#F4A261"/>
        <ellipse cx="110" cy="156" rx="46" ry="38" fill="#FFF3E0"/>
        <circle cx="84"  cy="96" r="29" fill="#FFFDF7"/>
        <circle cx="136" cy="96" r="29" fill="#FFFDF7"/>
        <g stroke="#3B2F2A" stroke-width="6" fill="none" stroke-linecap="round">
          <path d="M70 98 Q84 82 98 98"/>
          <path d="M122 98 Q136 82 150 98"/>
        </g>
        <path d="M110 112 L97 124 Q110 136 123 124 Z" fill="#FFB703"/>
        <ellipse cx="86"  cy="204" rx="13" ry="6" fill="#FFB703"/>
        <ellipse cx="134" cy="204" rx="13" ry="6" fill="#FFB703"/>
      </svg>
    </div>
    <h2>You did it! 🎉</h2>
    <p>All 12 words this week — you’re a sight word star!</p>
    <button class="btn-again" id="againBtn">Play again</button>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
(function(){
  "use strict";
  var WORDS = ["Bam","Pat","Tap","map","jam","pan","End","and","at","sat","mat","sap"];
  var LOWER_WORDS = WORDS.map(function(w){return w.toLowerCase();});

  var $ = function(id){ return document.getElementById(id); };
  var wordEl=$("word"), card=$("card"), fb=$("feedback"), micBtn=$("micBtn"),
      helpBtn=$("helpBtn"), micLabel=$("micLabel"), owlEl=$("owl"), bubble=$("bubble"),
      chipsEl=$("chips"), overlay=$("overlay"), note=$("noSrNote");

  var GOOD=["Yay! You said it!","Great job! ⭐","Yes! That's right!","Awesome! 🎉","You did it!"];
  var TRY =["Almost! Try again! 💪","So close — try once more!","You can do it — try again!"];
  var pick=function(a){ return a[Math.floor(Math.random()*a.length)]; };

  /* ---------- state ---------- */
  var deck=[], current="", state="idle", mastered=new Set(), moodTimer=null;
  var pendingTimer=null, fbKind=null;

  function clearPending(){ if(pendingTimer){ clearTimeout(pendingTimer); pendingTimer=null; } }

  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

  /* ---------- chips ---------- */
  WORDS.forEach(function(w){
    var s=document.createElement("span");
    s.className="chip"; s.dataset.word=w; s.textContent=w;
    chipsEl.appendChild(s);
  });
  function renderChips(){
    chipsEl.querySelectorAll(".chip").forEach(function(c){
      var done=mastered.has(c.dataset.word);
      if(done && !c.classList.contains("done")){
        c.classList.add("done","pop");
        setTimeout(function(){c.classList.remove("pop")},600);
      } else if(!done){ c.classList.remove("done"); }
    });
  }

  /* ---------- game flow ---------- */
  function setState(s){
    state=s;
    micBtn.disabled = s!=="idle";
    helpBtn.disabled= s!=="idle";
  }
  function newGame(){
    clearPending(); closeMic();
    mastered.clear(); deck=shuffle(WORDS.slice()); renderChips();
    overlay.classList.remove("show"); stopCelebrate();
    nextWord();
  }
  function nextWord(){
    if(!deck.length){ celebrate(); return; }
    current=deck.pop();
    wordEl.textContent=current;
    card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");
    clearFeedback(); owlMood(null); setState("idle");
  }
  function showFeedback(msg,kind){ fb.textContent=msg; fb.className="feedback show "+kind; fbKind=kind; }
  function clearFeedback(){ fb.className="feedback"; fb.textContent=""; fbKind=null; liveHeardEl=null; }

  function owlMood(m,ms){
    owlEl.classList.remove("mood-happy","mood-listen");
    if(m) owlEl.classList.add(m);
    clearTimeout(moodTimer);
    if(ms) moodTimer=setTimeout(function(){ owlEl.classList.remove("mood-happy","mood-listen"); },ms);
  }

  function onCorrect(){
    setState("feedback"); fbKind="good"; owlMood("mood-happy",2000);
    showFeedback(pick(GOOD),"good"); sfxCorrect();
    var r=card.getBoundingClientRect();
    burst(r.left+r.width/2, r.top+r.height/2, 140);
    mastered.add(current); renderChips();
    clearPending();
    pendingTimer=setTimeout(function(){ clearFeedback(); nextWord(); },2100);
  }

  function gentle(msg){
    setState("feedback"); fbKind="try";
    fb.className="feedback show try";
    fb.textContent=msg;
    var h=lastHeard();
    if(h){
      var s=document.createElement("span");
      s.className="heard";
      s.textContent='I heard: "'+h+'"';
      fb.appendChild(s);
    }
    sfxWrong();
    clearPending();
    pendingTimer=setTimeout(function(){ clearFeedback(); setState("idle"); },2000);
  }

  /* ---------- speech: say the word (TTS) ---------- */
  var voices=[];
  if("speechSynthesis" in window){
    loadVoices(); speechSynthesis.onvoiceschanged=loadVoices;
  }
  function loadVoices(){ voices=speechSynthesis.getVoices(); }
  function pickVoice(){
    return voices.find(function(v){return /en[-_]US/i.test(v.lang)&&/google|samantha|zira|aria|jenny/i.test(v.name);})
        || voices.find(function(v){return /en[-_]US/i.test(v.lang);})
        || voices.find(function(v){return /^en/i.test(v.lang);}) || null;
  }
  function speak(w){
    if(!("speechSynthesis" in window)) return;
    var u=new SpeechSynthesisUtterance(w);
    u.lang="en-US"; u.rate=0.75; u.pitch=1.2;
    var v=pickVoice(); if(v) u.voice=v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }

  /* ---------- speech: listen (STT) — robust + multiple attempts per press ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ note.classList.add("show"); card.classList.add("tap-to-hear"); }

  var LISTEN_MS = 8000;      /* one press = up to ~8s of trying */
  var MAX_RESTARTS = 3;      /* safety cap so a chatty engine can't loop forever */
  var micRec=null, isListening=false, windowTimer=null, listeningSince=0, restarts=0;
  var heard=[], liveHeardEl=null;

  function lastHeard(){
    if(!heard.length) return "";
    var u=[]; heard.forEach(function(x){ if(u.indexOf(x)===-1) u.push(x); });
    return u[u.length-1];
  }

  /* normalize: lowercase, strip everything but letters ("s a t" -> "sat", "Bam" -> "bam") */
  function norm(s){ return (s||"").toLowerCase().replace(/[^a-z]/g,""); }
  /* word tokens: for filler like "uh, sat" */
  function tokens(s){ return (s||"").toLowerCase().replace(/[^a-z\s]/g," ").split(/\s+/).filter(Boolean); }

  /* Levenshtein distance (only ever need 0 or 1) */
  function lev(a,b){
    var m=a.length,n=b.length;
    if(Math.abs(m-n)>1) return 99;
    var d=[],i,j;
    for(i=0;i<=m;i++){d[i]=[i];}
    for(j=0;j<=n;j++){d[0][j]=j;}
    for(i=1;i<=m;i++)for(j=1;j<=n;j++){
      d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1,
        d[i-1][j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
    }
    return d[m][n];
  }

  /* Forgiving but safe matching (case-insensitive, so "Bam"/"Pat"/etc. work):
     - "s a t", "SAT!", "Bam"  -> exact after normalization
     - "uh, sat"               -> target appears as a whole word
     - one-sound-off for 3+ letter words (e.g. "pot" for "pat")
     - NEVER accepts another word from this week's list (jam != Bam, sat != Pat)  */
  function matches(target, raw){
    var t = target.toLowerCase();   /* match case-insensitively so "Bam" still works */
    var n=norm(raw), toks=tokens(raw);
    if(n===t) return true;
    if(toks.indexOf(t)!==-1) return true;
    if(n && n!==t && LOWER_WORDS.indexOf(n)!==-1) return false;   /* a different list word — reject */
    if(t.length>=3 && n.length>=2 && lev(n,t)<=1) return true;
    return false;
  }

  function showListeningUI(){
    fb.className="feedback show listen";
    fb.textContent="";
    var w=document.createElement("span"); w.className="bars";
    for(var i=0;i<5;i++){ w.appendChild(document.createElement("i")); }
    fb.appendChild(w);
    liveHeardEl=document.createElement("span");
    liveHeardEl.textContent="Take your time — try as many times as you need!";
    fb.appendChild(liveHeardEl);
  }
  function updateLiveHeard(raw){
    if(!liveHeardEl) return;
    var clean=raw.toLowerCase().replace(/\s+/g," ").trim();
    liveHeardEl.textContent='I heard "'+clean+'" — try again!';
  }

  /* Always-safe teardown: re-enables buttons, stops the mic, clears timers. */
  function closeMic(){
    isListening=false;
    if(windowTimer){ clearTimeout(windowTimer); windowTimer=null; }
    var r=micRec; micRec=null; liveHeardEl=null;
    if(r){ try{ r.abort(); }catch(e){} }
    micBtn.classList.remove("listening");
    micLabel.textContent="Say the word";
    owlMood(null);
  }

  /* Hard stop: guarantees we never stay stuck in "listening" (the old freeze). */
  function hardStop(){
    if(!isListening) return;
    closeMic();
    gentle("Almost! Try again!");
  }

  /* Open one recognition session. A fresh instance each time = no zombie mics. */
  function openMic(){
    var rec;
    try{ rec=new SR(); }
    catch(e){ closeMic(); gentle("Microphone unavailable — tap ? to hear it."); return; }
    micRec=rec;
    rec.lang="en-US";
    rec.continuous=true;      /* one session spans short pauses between tries */
    rec.interimResults=true;  /* catch a match early, before the final transcript */
    rec.maxAlternatives=5;

    rec.onresult=function(e){
      if(!isListening || micRec!==rec) return;
      /* only scan NEW results (resultIndex) — no re-scanning everything each event */
      for(var i=e.resultIndex;i<e.results.length;i++){
        var alts=e.results[i];
        for(var j=0;j<alts.length;j++){
          if(matches(current, alts[j].transcript)){ closeMic(); onCorrect(); return; }
        }
        /* update the visible "heard" line only for final results (avoids flicker) */
        if(alts.isFinal && alts.length){
          heard.push(alts[0].transcript.toLowerCase().replace(/\s+/g," ").trim());
          updateLiveHeard(alts[0].transcript);
        }
      }
    };

    rec.onerror=function(e){
      if(!isListening || micRec!==rec) return;
      if(e.error==="not-allowed"||e.error==="service-not-allowed"){
        closeMic(); gentle("Please let me hear you! 🎤"); return;
      }
      if(e.error==="audio-capture"){
        closeMic(); gentle("Microphone unavailable — tap ? to hear it."); return;
      }
      /* no-speech / network / unknown: keep listening, onend decides what to do */
    };

    rec.onend=function(){
      if(!isListening || micRec!==rec) return;
      /* still within the window? keep the mic open for another attempt */
      if((Date.now()-listeningSince) < LISTEN_MS && restarts < MAX_RESTARTS){
        restarts++;
        openMic();
      } else {
        closeMic();
        gentle("Almost! Try again!");
      }
    };

    try{ rec.start(); }
    catch(err){ closeMic(); gentle("Microphone unavailable — tap ? to hear it."); }
  }

  function startListening(){
    if(!SR || state!=="idle") return;
    /* stop the app's own voice so it can't be heard as an answer */
    if("speechSynthesis" in window) speechSynthesis.cancel();

    setState("listening"); hideBubble(); showListeningUI();
    micBtn.classList.add("listening"); micLabel.textContent="Listening…"; owlMood("mood-listen");
    isListening=true; listeningSince=Date.now(); restarts=0; heard=[];

    windowTimer=setTimeout(hardStop, LISTEN_MS);  /* single hard stop for the whole press */
    openMic();
  }

  /* ---------- buttons ---------- */
  micBtn.addEventListener("click", startListening);
  helpBtn.addEventListener("click", function(){
    if(state!=="idle") return;
    speak(current); sfxHelp(); owlMood("mood-happy",1000);
    showFeedback("Now say it!","hint");
    setTimeout(function(){ if(state==="idle") clearFeedback(); },1900);
  });

  /* Parent fallback: count the current word as correct and move on. */
  $("parentBtn").addEventListener("click", function(){
    if(state==="listening") closeMic();
    if(state==="feedback" && fbKind==="good") return; /* already advancing — ignore */
    clearPending();
    onCorrect();
  });

  card.addEventListener("click", function(){ if(!SR && state==="idle") speak(current); });
  $("againBtn").addEventListener("click", newGame);
  $("resetBtn").addEventListener("click", function(){ stopCelebrate(); overlay.classList.remove("show"); newGame(); });

  var bubbleHidden=false;
  function hideBubble(){ if(!bubbleHidden){ bubbleHidden=true; bubble.classList.add("hide"); } }
  setTimeout(hideBubble, 9000);

  /* ---------- sounds (WebAudio) ---------- */
  var actx=null;
  function ac(){
    if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(actx && actx.state==="suspended") actx.resume();
    return actx;
  }
  function tone(f,t,d,type,vol){
    var c=ac(); if(!c) return;
    try{
      var o=c.createOscillator(), g=c.createGain();
      o.type=type||"sine"; o.frequency.value=f; o.connect(g); g.connect(c.destination);
      var t0=c.currentTime+t;
      g.gain.setValueAtTime(0,t0);
      g.gain.linearRampToValueAtTime(vol||.18,t0+.02);
      g.gain.exponentialRampToValueAtTime(.001,t0+d);
      o.start(t0); o.stop(t0+d+.05);
    }catch(e){}
  }
  function sfxCorrect(){ [523.25,659.25,783.99,1046.5].forEach(function(f,i){ tone(f,i*.09,.28,"triangle",.2); }); }
  function sfxWrong(){ tone(311,0,.25,"sine",.14); tone(247,.16,.3,"sine",.14); }
  function sfxHelp(){ tone(880,0,.12,"sine",.12); tone(1318.5,.09,.16,"sine",.12); }
  function sfxWin(){ [523,659,784,1047,1319].forEach(function(f,i){ tone(f,i*.12,.3,"triangle",.2); });
                     [523,659,784].forEach(function(f){ tone(f,.7,.6,"sine",.12); }); }
  document.addEventListener("pointerdown", function(){ ac(); }, {once:true});

  /* ---------- confetti (capped so it can't run away) ---------- */
  var cvs=$("confetti"), ctx=cvs.getContext("2d");
  var COLORS=["#FF6B6B","#FFD93D","#2EC4B6","#37B24D","#FF9F1C","#5AA9E6"];
  var MAX_PARTICLES=600;
  var parts=[], raf=null, celebTimer=null;
  function resize(){ cvs.width=innerWidth; cvs.height=innerHeight; }
  addEventListener("resize", resize); resize();

  function burst(x,y,n){
    if(parts.length > MAX_PARTICLES) return;   /* safety cap for low-end devices */
    for(var i=0;i<n && parts.length<MAX_PARTICLES;i++){
      var a=Math.random()*Math.PI*2, sp=Math.random()*11+4;
      parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-6,g:.32,
        s:Math.random()*7+4,c:COLORS[i%COLORS.length],r:Math.random()*6.28,
        vr:(Math.random()-.5)*.35,life:90+Math.random()*60});
    }
    if(!raf) loop();
  }
  function loop(){
    ctx.clearRect(0,0,cvs.width,cvs.height);
    parts=parts.filter(function(p){ return p.life>0 && p.y<cvs.height+60; });
    for(var i=0;i<parts.length;i++){
      var p=parts[i];
      p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.vx*=.992; p.r+=p.vr; p.life--;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.globalAlpha=Math.min(1,p.life/40); ctx.fillStyle=p.c;
      ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.6); ctx.restore();
    }
    if(parts.length){ raf=requestAnimationFrame(loop); }
    else{ raf=null; ctx.clearRect(0,0,cvs.width,cvs.height); }
  }

  /* ---------- celebration ---------- */
  function celebrate(){
    stopCelebrate();               /* never let the timer stack */
    clearPending();
    setState("feedback"); clearFeedback();
    overlay.classList.add("show"); sfxWin();
    burst(cvs.width/2, cvs.height*.3, 160);
    celebTimer=setInterval(function(){
      burst(Math.random()*cvs.width, cvs.height*.2+Math.random()*90, 70);
    },700);
  }
  function stopCelebrate(){ if(celebTimer){ clearInterval(celebTimer); celebTimer=null; } }

  /* ---------- go! ---------- */
  newGame();
})();
</script>
</body>
</html>
